{{- /*
  TABEL-RENDER-HOOK. Kaldes for hver markdown-tabel og lægger den i
  .tabel-ramme, så den altid kan rulles vandret.
*/ -}}
<div class="tabel-ramme wide">
  <table>
    <thead>
      {{- range .THead }}
        <tr>
          {{- range . }}
            <th {{ with .Alignment }}style="text-align: {{ . }}"{{ end }}>{{ .Text }}</th>
          {{- end }}
        </tr>
      {{- end }}
    </thead>
    <tbody>
      {{- range .TBody }}
        <tr>
          {{- range . }}
            <td {{ with .Alignment }}style="text-align: {{ . }}"{{ end }}>{{ .Text }}</td>
          {{- end }}
        </tr>
      {{- end }}
    </tbody>
  </table>
</div>
