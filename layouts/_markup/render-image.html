{{- /*
  BILLED-RENDER-HOOK. Kaldes for hvert markdown-billede: skalerer til
  webp og skriver srcset, sizes, mål og loading="lazy". data-stor peger på
  den største udgave til lightboxen (assets/js/lightbox.js). Et blokbillede
  med title bliver en <figure> med synlig figcaption; kræver sitets
  markup.goldmark.parser.wrapStandAloneImageWithinParagraph = false.
*/ -}}
{{- $alt := .PlainText -}}
{{- $titel := .Title -}}
{{- $bred := .Page.Store.Get "i-bred" -}}
{{- $note := eq .Page.Type "noter" -}}
{{- $sizes := cond $bred
      "(min-width: 73.5em) 1128px, 100vw"
      (cond $note "(min-width: 73.5em) 744px, 92vw" "(min-width: 46rem) 680px, 92vw") -}}

{{- $r := "" -}}
{{- if not (urls.Parse .Destination).IsAbs -}}
  {{- $side := .PageInner -}}
  {{- with $side.Parent }}{{ if eq .BundleType "leaf" }}{{ $side = . }}{{ end }}{{ end -}}
  {{- with $side.Resources.GetMatch .Destination }}{{ $r = . }}{{ end -}}
{{- end -}}
{{- $kan := false -}}
{{- with $r -}}
  {{- if and (eq .ResourceType "image") (in (slice "png" "jpeg" "webp" "tiff" "bmp") .MediaType.SubType) -}}
    {{- $kan = true -}}
  {{- end -}}
{{- end -}}

{{- $svgmaal := "" -}}
{{- if and $note $r (eq $r.MediaType.SubType "svg") -}}
  {{- with findRESubmatch `viewBox="[\d.]+[ ,]+[\d.]+[ ,]+([\d.]+)[ ,]+([\d.]+)"` $r.Content }}{{ $svgmaal = index . 0 }}{{ end -}}
{{- end -}}

{{- $fig := and .IsBlock $titel -}}
{{- if $fig }}<figure class="billede">{{ end -}}
{{- if $kan -}}
  {{- $maal := cond $bred 1128 (cond $note 744 680) -}}
  {{- $saet := slice -}}
  {{- range (slice 480 800 1200 1600 2000 2400) -}}
    {{- if ge $r.Width . -}}
      {{- $saet = $saet | append (printf "%s %dw" ($r.Resize (printf "%dx webp q82" .)).RelPermalink .) -}}
    {{- end -}}
  {{- end -}}
  {{- $vist := $r -}}
  {{- if gt $r.Width $maal }}{{ $vist = $r.Resize (printf "%dx webp q82" $maal) }}{{ end -}}
  {{- $stor := $r.Resize (printf "%dx webp q82" (cond (gt $r.Width 2400) 2400 $r.Width)) -}}
  <img src="{{ $vist.RelPermalink }}"
       {{ with $saet }}srcset="{{ delimit . ", " }}" sizes="{{ $sizes }}"
       {{ end -}}
       width="{{ $vist.Width }}" height="{{ $vist.Height }}"
       data-stor="{{ $stor.RelPermalink }}" data-stor-b="{{ $stor.Width }}" data-stor-h="{{ $stor.Height }}"
       {{ if and $note (ge $vist.Width 670) }}class="stort{{ if ge $vist.Width 1000 }} stort-bred{{ end }}" {{ end -}}
       loading="lazy" decoding="async"
       alt="{{ $alt }}"{{ if not $fig }}{{ with $titel }} title="{{ . }}"{{ end }}{{ end }}>
{{- else if and $note $svgmaal -}}
  {{- $svgb := int (float (index $svgmaal 1)) -}}
  <img src="{{ $r.RelPermalink }}"
       width="{{ $svgb }}" height="{{ int (float (index $svgmaal 2)) }}"
       data-stor="{{ $r.RelPermalink }}" data-stor-b="{{ $svgb }}" data-stor-h="{{ int (float (index $svgmaal 2)) }}"
       {{ if ge $svgb 670 }}class="stort{{ if ge $svgb 1000 }} stort-bred{{ end }}" {{ end -}}
       loading="lazy" decoding="async"
       alt="{{ $alt }}"{{ if not $fig }}{{ with $titel }} title="{{ . }}"{{ end }}{{ end }}>
{{- else -}}
  <img src="{{ .Destination | safeURL }}" loading="lazy" decoding="async"
       alt="{{ $alt }}"{{ if not $fig }}{{ with $titel }} title="{{ . }}"{{ end }}{{ end }}>
{{- end -}}
{{- if $fig }}<figcaption>{{ $titel | markdownify }}</figcaption></figure>{{ end -}}
