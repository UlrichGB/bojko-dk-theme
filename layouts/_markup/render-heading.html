{{- /*
  OVERSKRIFT-RENDER-HOOK. Hver overskrift i brødteksten beholder sit
  auto-id og får en ankerlænke, så et enkelt afsnit kan citeres med adresse.
*/ -}}
<h{{ .Level }} id="{{ .Anchor }}">{{ .Text }}<a class="anker" href="#{{ .Anchor }}" aria-label="Link hertil: {{ .PlainText }}">#</a></h{{ .Level }}>
